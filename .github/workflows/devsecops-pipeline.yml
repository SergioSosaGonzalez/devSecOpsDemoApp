name: DevSecOps Complete Pipeline

on:
  push:
    branches: [ feature/devSecOps-pipeline ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  # 1. SECRET SCANNING (Gitleaks)
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # 3. SCA & CONTAINER SCAN (Trivy)
  sca-scan:
    name: SCA & Container Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  # 4. IAC SECURITY (Checkov)
  iac-scan:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: all # o especificamente terraform, dockerfile, etc.

  # 5. BUILD & DEPLOY
  build-and-deploy:
    name: Build & Deploy
    needs: [secret-scan, sca-scan, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - id: deployment
        uses: actions/deploy-pages@v4

  # 6. DAST (OWASP ZAP)
  dast-scan:
    name: DAST (OWASP ZAP)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.deployment.outputs.page_url }} # Tu URL desplegada
          artifact_name: 'zap-scan'
          cmd_options: '-I'